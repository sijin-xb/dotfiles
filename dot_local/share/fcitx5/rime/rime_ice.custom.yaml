patch:
    grammar/collocation_max_length: 7
    grammar/collocation_min_length: 2
    grammar/collocation_penalty: -10
    grammar/language: wanxiang-lts-zh-hans
    grammar/non_collocation_penalty: -20
    grammar/rear_penalty: -12
    grammar/weak_collocation_penalty: -35
    # ── 语境能力 ────────────────────────────────────────────────
    # contextual_suggestions：用语言模型（grammar）优化输出结果，
    # 表现为「跨输入词组预测」——上屏前文后影响下一个词的候选。
    # 万象官方（rime_wanxiang/wanxiang.schema.yaml）默认 false，注释「效果一般关闭」，
    # 副作用是模型预测会压过你实际想打的词（官方例子：上屏「现在」再打 zhineng
    # 会优先「智能」而非「只能」）。这里显式打开，是要那个「语境感」。
    # 不满意就改回 false 重新部署即可，无副作用残留。
    translator/contextual_suggestions: true

    # max_homophones：每个读音最多给几个同音候选。
    # 5 → 8（万象官方值）。注意：8 仍够不到「了」（liao 音下排第 19），
    # 这个开关只放宽候选池宽度，不做单字消歧。
    translator/max_homographs: 5
    translator/max_homophones: 8

    # ── 中文模式下按 `/` 弹出常用符号候选框 ────────────────────────────
    # 原理（librime/src/rime/gear/punctuator.cc）：
    #   按下 `/` 时 Punctuator::ProcessKeyEvent 先取 GetPunctDefinition('/')，
    #   查找顺序是 punctuator/half_shape → punctuator/symbols。取到定义并把按键
    #   推入输入串之后，只有「单值映射」才会立刻上屏（ConfirmUniquePunct），
    #   列表型映射只列出候选交给用户选。
    #   所以把 half_shape 里的 '/' 从单值 '/' 改成下面的多值列表，
    #   按 / 就弹出符号候选框，而不再直接上屏 '/'。
    #
    # 语法要点（踩过的坑）：
    #   1) 必须用 `punctuator/half_shape/+`（映射追加）这种扁平路径。
    #      写成嵌套结构 `punctuator: {half_shape: ...}` 会把整个 punctuator
    #      节点替换掉，v 模式符号表和全角标点会一起消失。
    #   2) 键名 '/' 不能出现在路径里（会被当成路径分隔符），只能放在值里。
    #
    # ── 关于「权重」────────────────────────────────────────────────
    #   punctuator 的列表型映射**没有** weight / initial_quality 字段，
    #   librime 按 FIFO 顺序产出候选 —— 即「列表顺序就是权重」。
    #   initial_quality 是 translator（词典类）的概念，只对 dictionary /
    #   table_translator 生成的候选生效，管不到这里。
    #   所以调权重 = 调下面的排列顺序，改完重新部署。
    #
    # ── 排序原则 ──────────────────────────────────────────────────
    #   1) page_size=9（见 default.custom.yaml），所以每 9 项为一页。
    #   2) 第 1 页放最常用的单字符标点，',' 第一项仍是字面量 '/'（空格上屏）。
    #   3) 成对符号（“” ‘’ （） 《》 【】 「」）必须相邻，避免跨页 —— 旧版
    #      里 '“' 在第 1 页末、'”' 在第 2 页首，选右引号要先翻页，已修正。
    #   4) ★重要★ 中文（半角）模式下，下面这些符号**本来就能一键打出**，
    #      放在候选框里只是"二次入口"，没必要占前面的位置：
    #        , → ，    . → 。    ? → ？    ! → ！    : → ：    ; → ；
    #        \ → 、    ` → ·    " → “”    ' → ‘’    ( ) → （）
    #        < > → 《》  [ ] → 【】  ^ → ……  _ → ——   % → %
    #      所以候选框的真正价值是**没有一键**的符号：
    #      × ÷ ° ℃ ￥ ～ √ ≈ ≠ ≤ ≥ ∞ ★ ☆ ✓ ✗ → ← ↑ ↓ ● ○ ◆ ◇
    #      本轮已把这些从第 4 页提到第 3 页起；而 [ ] { } 能直接打出的
    #      括号（【】「」）沉到最后。
    #   5) 低频 / v 模式已覆盖的（数学、箭头、图形、勾叉）统一沉到末尾。
    #
    # 翻页：`,` / `.`（default.custom.yaml 里已映射为 Page_Up / Page_Down）。
    # 需要字面量半角斜杠：候选第一项就是 '/'，按空格（或 1）即可上屏。
    punctuator/half_shape/+:
        '/':
            # ── 第 1 页：最常用的单字符标点 ──
            - '/'      # 字面量斜杠（空格/1 上屏）
            - '，'
            - '。'
            - '？'
            - '！'
            - '、'
            - '；'
            - '：'
            - '·'
            # ── 第 2 页：4 组成对符号，全部相邻 ──
            - '“'
            - '”'
            - '‘'
            - '’'
            - '（'
            - '）'
            - '《'
            - '》'
            - '——'
            # ── 第 3 页：没有一键、但常用的符号（本轮从后段提上来）──
            - '……'
            - '°'
            - '℃'
            - '×'
            - '÷'
            - '±'
            - '√'
            - '￥'
            - '～'
            # ── 第 4 页：数学与标记 ──
            - '≈'
            - '≠'
            - '≤'
            - '≥'
            - '∞'
            - '★'
            - '☆'
            - '✓'
            - '✗'
            # ── 第 5 页：箭头与图形 ──
            - '→'
            - '←'
            - '↑'
            - '↓'
            - '●'
            - '○'
            - '◆'
            - '◇'
            - '【'
            # ── 第 6 页：一键可达的括号（[ ] { } 已能直接打出，故放最后）──
            - '】'
            - '「'
            - '」'
