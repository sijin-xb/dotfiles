# =============================================================================
#  alacritty 配色 —— matugen 生成，不要手改
#  模板：~/.config/matugen/templates/alacritty/matugen-theme.toml
#
#  角色选择规则与 kitty 模板一致（那边有完整说明与实测数据）：
#  · 暗色方案下不可用 *_container / surface_container_lowest / outline_variant
#    —— 它们是 tone 10–30 的暗色，当 ANSI 文字色对比度只有 1.0–2.0。
#    旧版本这里 yellow=tertiary_container、cyan=secondary_container、
#    black=surface_container_lowest，三个槽位都不可读。
#  · bright 行用 `| lighten: 8.0` 从 normal 行提亮，保证 bold 有区分。
# =============================================================================

[colors.primary]
background = '{{colors.background.default.hex}}'
foreground = '{{colors.on_background.default.hex}}'

[colors.cursor]
text = '{{colors.background.default.hex}}'
cursor = '{{colors.primary.default.hex}}'

[colors.selection]
text = '{{colors.on_primary_container.default.hex}}'
background = '{{colors.primary_container.default.hex}}'

[colors.normal]
black = '{{colors.on_surface_variant.default.hex}}'
red = '{{colors.error.default.hex}}'
green = '{{colors.tertiary.default.hex}}'
yellow = '{{colors.secondary.default.hex}}'
blue = '{{colors.primary.default.hex}}'
magenta = '{{colors.tertiary_fixed.default.hex}}'
cyan = '{{colors.primary_fixed.default.hex}}'
white = '{{colors.on_background.default.hex}}'

[colors.bright]
black = '{{colors.on_surface.default.hex}}'
red = '{{colors.error.default.hex | lighten: 8.0}}'
green = '{{colors.tertiary.default.hex | lighten: 8.0}}'
yellow = '{{colors.secondary.default.hex | lighten: 8.0}}'
blue = '{{colors.primary.default.hex | lighten: 8.0}}'
magenta = '{{colors.tertiary_fixed.default.hex | lighten: 8.0}}'
cyan = '{{colors.primary_fixed.default.hex | lighten: 8.0}}'
white = '{{colors.on_background.default.hex | lighten: 8.0}}'
