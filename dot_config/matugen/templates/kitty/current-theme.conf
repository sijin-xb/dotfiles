# =============================================================================
#  kitty 配色 —— matugen 生成，不要手改
#  模板：~/.config/matugen/templates/kitty/current-theme.conf
#
#  ── 角色选择的硬约束（改之前先读）────────────────────────────────────────
#  本文件在**暗色方案**下渲染，所以只有 tone ≥ 60 的角色能当文字色用。
#  以下角色在暗色方案里是 tone 10–30 的**暗色**，是设计给背景的，拿来当 ANSI
#  文字色会直接看不见 —— 2026-10-02 实测过，kitty 有 5 个槽位对比度只有
#  1.04–1.98（WCAG AA 要求 4.5）：
#      surface_container_lowest  1.04   （以前当 color0 用）
#      tertiary_container        1.97   （以前当 color3/11 用）
#      secondary_container       1.98   （以前当 color6/14 用）
#  同理不可用：primary_container / error_container / outline_variant /
#  on_primary_fixed / on_secondary_fixed / on_tertiary_fixed / inverse_primary。
#
#  可用（tone 80–90，实测对比度 ≥ 6.3）：outline / error / tertiary / secondary
#  / primary / tertiary_fixed / primary_fixed / secondary_fixed / on_background
#  / on_surface / on_surface_variant。
#
#  ── 亮色行用 lighten 过滤器 ─────────────────────────────────────────────
#  MD3 只有 4 个色相家族（primary/secondary/tertiary/error），8 个 ANSI 槽位
#  必然有同族重复 —— 这是方案本身的限制，不是映射写错。能做的是保证
#  「每个槽位都够亮」+「bright 一定比 normal 亮」。后者用 `| lighten: 8.0`
#  实现：同一角色提亮 8%，色相不变。
#
#  ── 配套设置（不在本文件里）─────────────────────────────────────────────
#  · config.toml [config] contrast = 0.3   —— 全局提对比（实测最低 ANSI 槽位
#    从 5.84 提到 7.02）。⚠ 不要设 0.4 以上：实测 0.5 时最低槽位反而掉到
#    1.13，因为高对比会把 outline 这类中间调角色压暗。
#  · config.toml 给本模板挂 type = 'SchemeExpressive' —— 让终端拿到多色相
#    调色板（primary 青 / tertiary 黄 / secondary 粉），tonal-spot 全是一个
#    色相，ANSI 颜色区分度只有 2 个色相桶，expressive 有 4 个。
#  · kitty.conf background_opacity 必须为 1.0 —— 半透明会让壁纸透上来，
#    背景色与壁纸混合后实际对比度低于本文件算出的值。
# =============================================================================

foreground {{colors.on_background.default.hex}}
background {{colors.background.default.hex}}
cursor {{colors.primary.default.hex}}
cursor_text_color {{colors.background.default.hex}}
selection_foreground {{colors.on_primary_container.default.hex}}
selection_background {{colors.primary_container.default.hex}}

# ── 普通色（tone 80–90，全部可读）────────────────────────────────────────
color0 {{colors.on_surface_variant.default.hex}}
color1 {{colors.error.default.hex}}
color2 {{colors.tertiary.default.hex}}
color3 {{colors.secondary.default.hex}}
color4 {{colors.primary.default.hex}}
color5 {{colors.tertiary_fixed.default.hex}}
color6 {{colors.primary_fixed.default.hex}}
color7 {{colors.on_background.default.hex}}

# ── 亮色（同角色提亮 8%，保证 bold 有视觉区分）──────────────────────────
color8 {{colors.on_surface.default.hex}}
color9 {{colors.error.default.hex | lighten: 8.0}}
color10 {{colors.tertiary.default.hex | lighten: 8.0}}
color11 {{colors.secondary.default.hex | lighten: 8.0}}
color12 {{colors.primary.default.hex | lighten: 8.0}}
color13 {{colors.tertiary_fixed.default.hex | lighten: 8.0}}
color14 {{colors.primary_fixed.default.hex | lighten: 8.0}}
color15 {{colors.on_background.default.hex | lighten: 8.0}}
