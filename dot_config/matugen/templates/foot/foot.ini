# =============================================================================
#  foot 配色 —— matugen 生成，不要手改
#  模板：~/.config/matugen/templates/foot/foot.ini
#
#  角色选择规则与 kitty 模板一致（那边有完整说明与实测数据）：
#  · 暗色方案下不可用 *_container / surface_container_lowest —— 它们是
#    tone 10–30 的暗色，当 ANSI 文字色对比度只有 1.0–2.0。
#    旧版本这里 regular3=tertiary_container、regular6=secondary_container、
#    regular0=surface_container_lowest，三个槽位都不可读。
#  · bright 行用 `| lighten: 8.0` 从 normal 行提亮（hex_stripped 上过滤
#    同样可用，实测输出仍是 stripped）。
#  ── 光标与 colorN 的取值（2026-10-06 调整）─────────────────────────────
#  · cursor 用 on_surface（中性近白），**不用** primary：光标是每时每刻都在
#    闪的元素，绑主题强调色会让整个终端被那一个色相牵着走（实测被吐槽
#    「指针居然是蓝色的」）。要改回强调色就把下面这行的角色换回 primary。
#  · color0 用 outline（tone 60，实测对比度 ≈7）而不是 on_surface_variant
#    （tone 80，≈10.9）：ANSI black 就是「暗灰」语义，塞亮色会让 16 色只剩
#    一层明度（1-7 全挤在 10.9，跟 white 的 14.3 几乎平齐）；outline 既过
#    AA 4.5 又保住了「黑」的层次。color8（bright black）相应退到
#    on_surface_variant，于是 0 < 8 < 7 < 15 的明度阶梯成立。

# =============================================================================

[colors]
background={{colors.background.default.hex_stripped}}
foreground={{colors.on_background.default.hex_stripped}}

regular0={{colors.outline.default.hex_stripped}}
regular1={{colors.error.default.hex_stripped}}
regular2={{colors.tertiary.default.hex_stripped}}
regular3={{colors.secondary.default.hex_stripped}}
regular4={{colors.primary.default.hex_stripped}}
regular5={{colors.tertiary_fixed.default.hex_stripped}}
regular6={{colors.primary_fixed.default.hex_stripped}}
regular7={{colors.on_background.default.hex_stripped}}

bright0={{colors.on_surface_variant.default.hex_stripped}}
bright1={{colors.error.default.hex_stripped | lighten: 8.0}}
bright2={{colors.tertiary.default.hex_stripped | lighten: 8.0}}
bright3={{colors.secondary.default.hex_stripped | lighten: 8.0}}
bright4={{colors.primary.default.hex_stripped | lighten: 8.0}}
bright5={{colors.tertiary_fixed.default.hex_stripped | lighten: 8.0}}
bright6={{colors.primary_fixed.default.hex_stripped | lighten: 8.0}}
bright7={{colors.on_background.default.hex_stripped | lighten: 8.0}}

[colors.cursor]
cursor={{colors.on_surface.default.hex_stripped}}
text={{colors.background.default.hex_stripped}}

[colors.selection]
background={{colors.primary_container.default.hex_stripped}}
foreground={{colors.on_primary_container.default.hex_stripped}}
