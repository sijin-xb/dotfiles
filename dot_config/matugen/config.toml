[config]
version_check = false

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'
# 光标主题按新的 primary 重渲染。挂在 m3colors 上是因为光标脚本要读
# 它刚写出的 colors.json；放在这里可以覆盖所有 matugen 调用方
# （switchwall.sh 换壁纸、matugen-update.sh 切策略/明暗），
# 不必逐个改动上游脚本。脚本内部有主色缓存，颜色没变时立即返回，
# 并尊重 设置 → 界面 → 配色生成 → 光标 开关。
post_hook = 'nohup "$HOME/.config/hypr/hyprland/scripts/generate_cursor_theme.py" >/dev/null 2>&1 &'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/hyprland/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty/matugen-theme.toml'
output_path = '~/.config/alacritty/matugen-theme.toml'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty/current-theme.conf'
output_path = '~/.config/kitty/current-theme.conf'

[templates.foot]
input_path = '~/.config/matugen/templates/foot/foot.ini'
output_path = '~/.config/foot/matugen.ini'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/ii-auto.theme'
# btop 的 SIGUSR2 等价于界面里的 Ctrl+R「重载配置」：会重读 btop.conf 并重设
# 主题，正在跑的实例立刻换色，不需要重启。没有实例时 pkill 返回 1，忽略即可。
post_hook = 'pkill -SIGUSR2 -x btop 2>/dev/null || true'

[templates.mako]
input_path = '~/.config/matugen/templates/mako/colors.conf'
output_path = '~/.config/mako/colors.conf'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch-config.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/kde/color.txt'
output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/matugen-colors.kdl'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/config'

[templates.fcitx5]
input_path = '~/.config/matugen/templates/fcitx5-theme.conf'
output_path = '~/.local/share/fcitx5/themes/Matugen/theme.conf'
# 主题生成后重启 fcitx5，使新配色立即生效（否则 fcitx5 不会热重载主题文件）
post_hook = 'fcitx5-remote -r'

[templates.waybar_colors]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'

[templates.waybar_niri_colors]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar-niri-Win11Like/colors.css'

[templates.starship]
input_path = '~/.config/matugen/templates/starship.toml'
output_path = '~/.config/starship.toml'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.obs]
input_path = '~/.config/matugen/templates/obs-matugen.obt'
output_path = '~/.config/obs-studio/themes/matugen.obt'

# VSCode 注入片段。settings.json 是用户自己的配置，不能整体覆盖，
# 所以这里只生成片段到缓存目录，由 material-code 扩展 / 手动 include 使用。
[templates.vscode]
input_path = '~/.config/matugen/templates/vscode-inject.json'
output_path = '~/.cache/matugen_vscode_inject.json'
