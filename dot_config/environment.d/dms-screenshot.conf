# DMS 截图（`dms screenshot`）的落盘目录。
#
# 为什么单独一个文件：DMS 的截图 CLI 没有配置项，只读环境变量
# DMS_SCREENSHOT_DIR；不设时落到 $XDG_PICTURES_DIR/Screenshots，也就是
# ~/Pictures/Screenshots/。这里指到 niri 内置截图用的那个子目录，两套后端
# 共用一份历史截图，不会分家。
#
# 覆盖范围（与 cursor.conf 同理，两处写同一个值）：
#   · 本文件由 systemd user session 读取 → 覆盖经 systemd / dbus 启动的进程
#   · ~/.config/niri/config.kdl 的 environment 块 → 覆盖 niri 自己 spawn 的
#     绑定（截图键就在这里跑）
# 改目录时两处都要改。
#
# 注：DMS 生成的文件名是它自己的 screenshot_<日期>_<时间>.png，
#     与 niri 内置截图（config.kdl 的 screenshot-path）的命名不同。
DMS_SCREENSHOT_DIR=/home/xibie/Pictures/Screenshots/Niri-screenshots
