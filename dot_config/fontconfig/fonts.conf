<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<!--
  字体方案（2026-09-22 改）：

    sans-serif → 霞鹜文楷等宽（LXGW WenKai Mono），**只对 Chrome 生效**
                 （靠 prgname 限定，见文件末尾的 <match>）。其他进程仍是思源黑体 CN。
                 注意：霞鹜文楷自带 Latin，Chrome 网页里的英文也会变楷体，无法规避
                 （试过 lang=zh 规则，中英文一起掉到「文泉驿正黑」）。
    Segoe UI   → 思源黑体 CN。Electron 应用常请求这个族，故意不动，
                 让桌面 GUI 保持黑体。
    serif      → 霞鹜文楷（LXGW WenKai），非等宽，阅读用，16px 以上才出效果
    monospace  → JetBrains Maple Mono，Latin 和中文都是它。霞鹜文楷只有
                 8 个 GSUB 特性（无 liga/cv/ss/zero）且无 Bold/Italic，不适合代码。

  完全不经过 fontconfig 别名的：
    fcitx5     → classicui.conf 里写死 思源黑体 CN
    quickshell → Config.qml 里硬编码 Google Sans / JetBrains Mono NF
    GTK        → settings.ini 里写死 "Google Sans, Source Han Sans CN"
    kitty      → symbol_map 按码点指定中文，应用自己实现，不依赖 fontconfig
-->
<alias>
<family>Segoe UI</family>
<prefer>
  <family>Source Han Sans CN</family>
  <family>Google Sans</family>
</prefer>
</alias>
<alias>
<family>sans-serif</family>
<prefer>
  <family>LXGW WenKai Mono</family>
  <family>Source Han Sans CN</family>
</prefer>
</alias>

<!--
  楷体只给 Chrome，两个条件缺一不可：

  1) 光写 <alias><prefer> 对 sans-serif **不生效**——通用族名的打分不按 prefer 的
     列表顺序走，实测霞鹜文楷等宽被排到 195 个候选里的第 164 位。必须
     binding="strong" 前置才真正生效。别"简化"回纯 alias，会静默失效。

  2) 必须按 prgname 限定到 Chrome。因为 **所有应用的汉字回退查询都被 fontconfig
     标记成 genericfamily=2（即 sans-serif 通用族）**——实测 "Google Sans:charset=6c38"
     的 pattern 里就是这个值。所以无条件改 sans-serif，quickshell 的中文也会变楷体
     （这正是 2026-09-22 凌晨那次「不习惯」的根因）。限定 prgname 后只有 Chrome 变。

  Chrome 的实际进程是 /opt/google/chrome/chrome，故 prgname 是 "chrome"；
  google-chrome-stable 是包装脚本，一并写上以防启动方式不同。
-->
<match target="pattern">
  <test name="prgname"><string>chrome</string></test>
  <test name="family"><string>sans-serif</string></test>
  <edit name="family" mode="prepend" binding="strong">
    <string>LXGW WenKai Mono</string>
  </edit>
</match>
<match target="pattern">
  <test name="prgname"><string>google-chrome-stable</string></test>
  <test name="family"><string>sans-serif</string></test>
  <edit name="family" mode="prepend" binding="strong">
    <string>LXGW WenKai Mono</string>
  </edit>
</match>

<alias>
<family>serif</family>
<prefer>
  <family>LXGW WenKai</family>
  <family>Source Han Sans CN</family>
</prefer>
</alias>
<alias>
<family>monospace</family>
<prefer>
  <family>JetBrains Maple Mono</family>
  <family>LXGW WenKai Mono</family>
  <family>Source Han Sans CN</family>
</prefer>
</alias>
</fontconfig>
