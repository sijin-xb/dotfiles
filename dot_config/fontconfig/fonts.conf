<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<!--
  字体方案（2026-09-20 定）：
    UI / 正文 → 思源黑体（Source Han Sans CN）
               1080p 下 11px 依然清晰，中性、专业，Latin 部分源自 Source Sans。
    阅读/文档 → 霞鹜文楷（LXGW WenKai），走 serif 别名，16px 以上才发挥手写感
    等宽     → JetBrains Maple Mono（Latin）+ 霞鹜文楷等宽（中文）
               实测 Noto Sans Mono CJK SC **不含中文字形**（fc-list ":charset=6c38"
               查不到它），真正带中文的等宽只有「霞鹜文楷等宽」和「文泉驿等宽正黑」，
               故选前者，避免代码里的中文变豆腐块。

  注意：Google Sans **没有中文字形**。GTK 里把 "Google Sans, Source Han Sans CN"
  作为回退链（Latin 用前者、中文用后者），下面的别名则是全局兜底。
-->
<alias>
<family>Segoe UI</family>
<prefer>
  <family>Source Han Sans CN</family>
  <family>Google Sans</family>
</prefer>
</alias>
<alias>
<family>sans-serif</family>
<prefer>
  <family>Source Han Sans CN</family>
  <family>Google Sans</family>
</prefer>
</alias>
<alias>
<family>serif</family>
<prefer>
  <family>LXGW WenKai</family>
  <family>Source Han Sans CN</family>
</prefer>
</alias>
<alias>
<family>monospace</family>
<prefer>
  <family>JetBrains Maple Mono</family>
  <family>LXGW WenKai Mono</family>
  <family>Source Han Sans CN</family>
</prefer>
</alias>
</fontconfig>
