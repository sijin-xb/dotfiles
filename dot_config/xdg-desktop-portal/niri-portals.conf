[preferred]
# niri 自带的 portal 后端由 fork 编译进 niri 本体，DBus 名是
# org.freedesktop.impl.portal.desktop.niri，提供 ScreenCast 与 Screenshot。
#
# 2026-09-23 改：这两项原来指向 gnome，等于让 fork 自带的录屏/截图后端一直闲置，
# 走的是 GNOME 的实现。改到 niri 之后才会用到 niri 自己的选区界面
# （配色来自 matugen 生成的 screen-cast-picker，见 matugen-colors.kdl）。
#
# Secret 必须显式指到 gnome-keyring：gnome 与 gtk 后端都不提供
# org.freedesktop.impl.portal.Secret，只靠 default 兜不住，密钥环相关的
# 程序（Chromium/Electron 系）会拿不到 Secret portal。
default = gnome;gtk
org.freedesktop.impl.portal.ScreenCast = niri
org.freedesktop.impl.portal.Screenshot = niri
org.freedesktop.impl.portal.Secret = gnome-keyring
org.freedesktop.impl.portal.Access = gtk
org.freedesktop.impl.portal.FileChooser = gtk
org.freedesktop.impl.portal.Notification = gtk
