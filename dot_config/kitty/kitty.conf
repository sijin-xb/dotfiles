# ================= 核心显示 =================
# 注意是 JetBrainsMono（无空格）——写成 "JetBrains Mono" 匹配不上，
# kitty 会静默退到下一个字体，英文就不是 JetBrains 了。
font_family      JetBrainsMono Nerd Font
# 中文用霞鹜文楷等宽：楷体风格长时间看不累，等宽版保证中英对齐。
#
# 用 symbol_map 显式指定字符范围，而不是再加一条 font_family——实测后者会让
# kitty 把中文字体当成主字体（英文也走了中文，Nerd 图标另找 fallback）。
# 这里只把汉字、中文标点、全角字符交给霞鹜文楷，其余仍走 JetBrainsMono。
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF,U+3000-U+303F,U+FF00-U+FFEF,U+2000-U+206F LXGW WenKai Mono Screen
font_size        11.0

# 远程控制：只开 Unix socket，不监听 TCP。
#
# 为什么必须有这一行：matugen 的 post_hook 用 `kitty @ set-colors` 把新配色
# 推给所有窗口。没有它的时候 kitty 会退回「往 tty 写 DCS 再读回复」的路径，
# 每次换壁纸都会把 [*x@kitty-cmd{...}] 这种转义序列打进终端（实测确认）。
# 开了之后 kitty 建立 socket 并给子进程设 KITTY_LISTEN_ON，post_hook 据此
# 判断是否可用，不再靠探测。
#
# socket-only 比 yes 安全：只允许通过 Unix socket 控制，不开 TCP 端口。
# 想彻底关掉就注释这一行，代价是 kitty 配色要重启终端才更新。
allow_remote_control socket-only

# 背景色与前景色（强制中性深灰）
# background       #101010
# foreground       #eaeaea

# 透明度设置
# 不透明度。
# 0.75 会让 25% 的壁纸透上来 —— 这是「终端背景与壁纸分不开、文字发灰」的
# 直接原因，也是为什么按纯色背景算出的对比度看起来达标、实际观感却差。
#
# 2026-10-02 保留 0.75（不改透明度），改成把颜色本身做够：
#   ANSI 最低对比度 1.04 → 10.84（0 个槽位低于 WCAG AA）
#   方案类型换成 expressive，色相桶 2 → 4、平均饱和 0.15 → 0.25
# 实测半透明下的**有效**对比度（0.75 + 壁纸底色）：
#   壁纸纯黑 → 最低 11.24    中灰 → 7.87    接近白 → 5.46
# 即使壁纸最亮，最低槽位仍高于 AA(4.5)。所以透明度和可读性可以兼得。
# 真遇到浅色壁纸读不清，再把这里降到 1.0 即可 —— 那是最后手段，不是首选。
background_opacity 0.75
dynamic_background_opacity no
hide_window_decorations yes

# 窗口内边距（文字不贴边，视觉更呼吸）
window_padding_width  10

# ================= 光标 =================
cursor_shape     beam
cursor_trail     1
# 光标颜色不在这里设：current-theme.conf（matugen 生成）里有 cursor，
# 而它在本文件末尾 include，会覆盖这里的任何取值。
# ⚠ 以前这行写的是 `cursor_color` —— kitty 没有这个选项（合法名是 `cursor`），
#   所以它从来没生效过，光标一直是模板给的 primary 强调色。
# cursor_blink_interval 0  # 如需关闭闪烁可取消注释

# ================= Shell =================
shell            fish

# ================= 配色锁定（防 quickshell/主题注入蓝色） =================
# color0  #101010  # 锁定 ANSI 黑色
# color8  #555555  # 锁定 ANSI 亮黑
# color7  #eaeaea  # 锁定 ANSI 白色
# color15 #ffffff  # 锁定 ANSI 亮白

# ================= 快捷键 =================
# 复制 / 中断
map ctrl+c copy_or_interrupt

# 搜索
map ctrl+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# 翻页
map page_up scroll_page_up
map page_down scroll_page_down

# 字体缩放（精简冗余，兼容主键盘与小键盘）
map ctrl+plus change_font_size all +1
map ctrl+minus change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_add change_font_size all +1
map ctrl+kp_subtract change_font_size all -1
map ctrl+kp_0 change_font_size all 0


# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
