include="~/.config/fuzzel/fuzzel_theme.ini"
font=Google Sans Flex:size=14:weight=medium
dpi-aware=no
terminal=kitty -1
prompt="  "
layer=overlay
anchor=center
width=52
lines=10
horizontal-pad=24
vertical-pad=14
inner-pad=8
line-height=34
icons-enabled=yes
icon-theme=Adwaita
match-mode=fzf

[border]
radius=17
width=2

[dmenu]
exit-immediately-if-empty=yes
