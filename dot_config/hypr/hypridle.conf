# 锁屏：交给正在运行的 quickshell。
#   默认 caelestia（qs -c caelestia ipc call lock lock）
#   回退 end4-pC（qs -c end4-pC ipc call lock lock）
#   两个都没跑 → hyprlock
# 这里走 qs 的 IPC 而不是 hyprctl dispatch，避免依赖 hyprctl 对 Lua 表达式的支持，
# 也不依赖具体是哪个 shell（两边的 lock IPC target 都有 lock() 函数）。
$lock_cmd = sh -c 'qs -c caelestia ipc call lock lock 2>/dev/null || qs -c end4-pC ipc call lock lock 2>/dev/null || hyprlock'
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $lock_cmd
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
