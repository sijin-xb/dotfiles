# 光标环境变量：与 DMS 的光标设置保持一致。
#
# 唯一来源是 DankMaterialShell/settings.json 的 cursorSettings（当前
# Matugen-Cursors / 24）。DMS 据此生成 ~/.config/niri/dms/cursor.kdl。
# 主题的**配色**由 ~/.config/scripts/generate_cursor_theme.py 在每次换壁纸后
# 按 matugen 的 primary 重新着色，并顺带把 DMS 设置里可能残留的旧主题名核对回来。
# 要改主题或尺寸请改 DMS 设置，然后同步这里的两个值。
#
# 覆盖范围：本文件由 systemd user session 读取，作用于经 systemd / dbus
# 激活启动的程序；niri 自己 spawn 的程序走 ~/.config/niri/config.kdl 的
# environment 块，那边也是同样的两个值。
#
# 2026-09-23：原来写的是 catppuccin-mocha-flamingo-cursors / 24（Hyprland 时代残留）。
#
# 2026-10-02：尺寸 32 → 24。32 是旧值，而下面五处全都是 24，只有这里漏改：
#   · ~/.config/niri/config.kdl            environment { XCURSOR_SIZE "24" }
#   · ~/.config/hypr/custom/env.lua        hl.env("XCURSOR_SIZE", "24")
#   · ~/.config/hypr/hyprland/execs.lua    hl.env("XCURSOR_SIZE", "24")
#   · DMS settings.json                    cursorSettings.size = 24
#   · generate_cursor_theme.py             SIZE = 24
# 结果是经 systemd/dbus 启动的程序（DMS 本身、Electron 应用等）拿 32 号光标，
# 而合成器画的是 24 号，同一屏上两种尺寸。改这里即可对齐。
XCURSOR_THEME=Matugen-Cursors
XCURSOR_SIZE=24
