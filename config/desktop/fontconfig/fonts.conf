<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

 <!-- 将常见网页字体映射到通用族，统一走下面的偏好链 -->
 <!-- 注意：fontconfig 全局生效，依赖 Arial 度量兼容的文档（如 LibreOffice）排版会有偏移 -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>Arial</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Segoe UI</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Liberation Sans</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Liberation Mono</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>monospace</string>
  </edit>
 </match>

 <!-- 按语言切换 CJK 地区字形（日/韩/繁中）。
      注意：fontconfig 按规则执行顺序排列 prepend 的值（先执行的规则排得更靠前），
      因此语言规则必须写在默认规则之前，地区字体才能排到 MiSans 前面。
      浏览器按页面语言、GTK/Qt 按系统区域传入 lang；未带 lang 的请求不受影响，保持简中默认 -->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ja</string>
  </test>
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans CJK JP</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ko</string>
  </test>
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans CJK KR</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>zh-tw</string>
  </test>
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans CJK TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>zh-hk</string>
  </test>
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans CJK HK</string>
  </edit>
 </match>

 <!-- 衬线族（含 ja / ko / 繁中的地区变体）已整体搬到
      ~/.config/fontconfig/conf.d/50-lxgw-wenkai.conf。
      原因：conf.d 在加载顺序上先于本文件，而 prepend 是「先执行的排得更前」，
      所以衬线规则写在这里会被 conf.d 遮蔽。无衬线的地区规则不受影响，仍在下面。 -->

 <!-- 兜底衬线：片段存在时本规则被遮蔽、不生效（family 列表尾部会多出重复项，无害）；
      万一片段被删掉，serif 至少回落到臻楷 GB，而不是发行版默认的「文泉驿正黑」（黑体）。 -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>LXGW ZhenKai GB</string>
   <string>LXGW WenKai Screen</string>
   <string>Noto Color Emoji</string>
  </edit>
 </match>

 <!-- Quickshell（caelestia）：sans-serif 链单独钉回 MiSans，不跟着全局换成霞鹜。
      为什么需要它：caelestia 自己的字体是硬编码族名（GoogleSansFlex /
      CaskaydiaCove NF，见 plugin/src/Caelestia/Config/appearanceconfig.hpp），
      但这两个族都没有中文字形 —— 中文是逐字回退到 fontconfig 的 sans-serif
      链的，所以全局换字体照样会把它的中文带跑。用 prgname 限定（取
      /proc/<pid>/comm，quickshell 的 comm 实测是 `qs`）单独隔离。
      必须写在下面那条通用规则之前：prepend 是「先执行的排得更前」。 -->
 <match target="pattern">
  <test name="prgname">
   <string>qs</string>
  </test>
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>MiSans</string>
  </edit>
 </match>

 <!-- 默认无衬线字体：霞鹜文楷（简中或未指定语言时生效）。
      用屏幕阅读版（字重比标准版足，界面正文不至于发细），
      Noto Color Emoji 兜底表情。 -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>LXGW WenKai Screen</string>
   <string>Noto Color Emoji</string>
  </edit>
 </match>

 <!-- 默认等宽字体：霞鹜文楷等宽。
      代价要说清楚：霞鹜全系没有 Nerd Font 变体、也没有 liga 连字。
      所以把 Maple Mono NF CN 留在链尾兜底图标（缺字形时逐字回退到它），
      但连字确实没有了 —— 要连字就把这行删掉换回 Maple。 -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>monospace</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>LXGW WenKai Mono Screen</string>
   <string>Maple Mono Normal NF CN</string>
  </edit>
 </match>

 <!-- system-ui 使用我们定义的无衬线字体，必须，否则部分插件会出现豆腐块 -->
 <match target="pattern">
  <test name="family">
   <string>system-ui</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>sans-serif</string>
  </edit>
 </match>

 <!-- Map BlinkMacSystemFont (常见于网页识别到apple color emoji的字体栈) 到我们偏好的字体 -->
 <match target="pattern">
  <test name="family">
   <string>BlinkMacSystemFont</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>LXGW WenKai Screen</string>
   <string>Noto Sans CJK SC</string>
   <string>Noto Color Emoji</string>
  </edit>
 </match>

 <selectfont>
  <rejectfont>
   <pattern>
    <patelt name="family">
     <!-- This font is causing problem with GitHub -->
     <string>Nimbus Sans</string>
    </patelt>
   </pattern>
  </rejectfont>
 </selectfont>

<!-- 渲染设置，一般适用于4k之下的显示屏 -->
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>

</fontconfig>
