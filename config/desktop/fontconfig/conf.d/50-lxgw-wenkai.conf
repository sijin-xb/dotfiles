<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

 <!--
  霞鹜文楷接管衬线族（serif）。

  为什么整个 serif 都写在这里：fontconfig 对 <edit mode="prepend"> 是「先执行的规则排得更前」，
  而 /etc/fonts/conf.d/50-user.conf 先 include 本目录（conf.d）再 include fonts.conf，
  所以本文件的 prepend 必然压过 fonts.conf。若这里只写一条无条件的 serif 规则，
  会把 ja / ko / zh-tw / zh-hk 的地区字体一起抢走，因此四条语言规则必须在这里重述。
  （fontconfig 手册虽有 compare="not_contains"，但 2.18.3 上对 lang 实测不生效，无法用守卫豁免。）

  规则顺序即优先级：越靠前越优先。

  注意：本文件是衬线族的**唯一定义处**（fonts.conf 里原有的衬线规则已移除）。
  删掉本文件不会回到旧方案，而是让 serif 回落到发行版默认的「文泉驿正黑」（黑体）。
  真要弃用，请先把下面这条默认衬线链搬回 fonts.conf。

  下面的网页衬线字体名映射**必须放在本文件里**，不能放 fonts.conf：
  <edit mode="assign"> 只会影响「之后」执行的规则，而本文件先于 fonts.conf 加载，
  写在 fonts.conf 里的映射永远喂不到这里的链规则（实测会落到兜底链的臻楷 GB）。
 -->

 <!-- 网页常见的衬线字体名 → 通用 serif，统一走下面的偏好链 -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>Georgia</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Times</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>serif</string>
  </edit>
 </match>

 <!-- 宋体系字体名 → Noto Serif CJK SC（真宋体，不并入文楷） -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>宋体</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Serif CJK SC</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>SimSun</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Serif CJK SC</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Songti SC</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>Noto Serif CJK SC</string>
  </edit>
 </match>

 <!-- 日文衬线 -->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ja</string>
  </test>
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Serif CJK JP</string>
  </edit>
 </match>

 <!-- 韩文衬线 -->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>ko</string>
  </test>
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Serif CJK KR</string>
  </edit>
 </match>

 <!-- 繁中衬线：延续楷体审美 -->
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>zh-tw</string>
  </test>
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>LXGW WenKai TC</string>
   <string>Noto Serif CJK TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="lang" compare="contains">
   <string>zh-hk</string>
  </test>
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>LXGW WenKai TC</string>
   <string>Noto Serif CJK TC</string>
  </edit>
 </match>

 <!--
  默认衬线（简中 / 未指定语言）：
   - Noto Serif 只含拉丁（无 CJK），放最前让西文走正经衬线，中文逐字回退到下一项
   - LXGW WenKai Medium 是标准文楷的中等字重，比 Screen 版厚，正文不至于发细
   - 文楷全系没有 Bold / Italic，粗体与斜体由渲染器合成
   - 屏幕阅读版与臻楷 GB 作为补充回退，Noto Color Emoji 兜底表情
   - 文楷不含 TrueType 微调指令，所以不需要为它单独写 hinting 规则
 -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>Noto Serif</string>
   <string>LXGW WenKai Medium</string>
   <string>LXGW WenKai Screen</string>
   <string>LXGW ZhenKai GB</string>
   <string>Noto Color Emoji</string>
  </edit>
 </match>

 <!-- 楷体别名 → 文楷（想用常规字重就把 Medium 改成 LXGW WenKai） -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>KaiTi</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>LXGW WenKai Medium</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>楷体</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>LXGW WenKai Medium</string>
  </edit>
 </match>

</fontconfig>
