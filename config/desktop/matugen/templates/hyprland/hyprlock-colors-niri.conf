# =============================================================================
#  niri 会话的 hyprlock 配色 —— matugen 生成，不要手改
#  模板：~/.config/matugen/templates/hyprland/hyprlock-colors-niri.conf
#
#  为什么和 Hyprland 侧（hyprlock-colors.conf）不共用一份：
#  两份 hyprlock 主配置用的变量名完全不同，互不重叠 ——
#    ~/.config/hypr/hyprlock.conf   → $text_color / $entry_color / $entry_border_color
#                                     / $font_family / $background_image
#    ~/.config/niri/hyprlock.conf   → $primary / $secondary / $tertiary / $error
#                                     / $surface / $surface_container / $on_surface
#  所以各自需要一份。本文件对应后者。
#
#  消费方（都在 niri 会话）：
#    ~/.config/niri/binds.kdl:60            Mod+Alt+L 锁屏
#    ~/.config/niri/scripts/powermenu:29    关机菜单 → 锁屏
#    ~/.config/niri/scripts/powermenu:38    挂起前锁屏
#  它们都用 `hyprlock -c ~/.config/niri/hyprlock.conf`，该主配置第 3 行
#  source 本文件。
#
#  格式：hyprlock 接受 rgba(RRGGBBAA)，所以用 hex_stripped 拼两位 alpha。
#  FF = 不透明。这里全用不透明：这些变量同时当文字色和背景色用，
#  带透明度会让文字发灰。要半透明自行改 alpha。
# =============================================================================

# 主色 —— 时钟、输入框渐变外圈
$primary = rgba({{colors.primary.default.hex_stripped}}FF)

# 次级色 —— 星期、验证中状态
$secondary = rgba({{colors.secondary.default.hex_stripped}}FF)

# 第三色 —— 输入框外圈渐变的中段
$tertiary = rgba({{colors.tertiary.default.hex_stripped}}FF)

# 错误色 —— 验证失败
$error = rgba({{colors.error.default.hex_stripped}}FF)

# 表面色 —— 壁纸加载失败时的兜底背景
$surface = rgba({{colors.surface.default.hex_stripped}}FF)

# 表面容器色 —— 输入框背景
$surface_container = rgba({{colors.surface_container.default.hex_stripped}}FF)

# 表面上的文字色 —— 输入文字
$on_surface = rgba({{colors.on_surface.default.hex_stripped}}FF)
