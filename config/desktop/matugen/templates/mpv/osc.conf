# =============================================================================
#  mpv OSC（屏幕控制器）配色 —— matugen 生成，不要手改
#  模板：~/.config/matugen/templates/mpv/osc.conf
#
#  为什么是 script-opts 而不是 mpv.conf：
#  OSC 是内置的 Lua 脚本，它的配色选项属于脚本选项（osc-*）。直接写进
#  mpv.conf 会报 option not found，必须走 script-opts 通道。本文件输出到
#  ~/.config/mpv/script-opts/osc.conf，mpv 会按脚本名自动加载，与
#  mpv.conf 里的 script-opts-append=osc-xxx=yyy 并存。
#
#  可用选项名以 mpv 内置 osc.lua 的 user_opts 为准（本机 mpv 0.41）：
#    background_color / buttons_color / top_buttons_color / held_element_color
#    timecode_color / time_pos_color / time_pos_outline_color / title_color
# =============================================================================

# 进度条底板
background_color={{colors.surface_container.default.hex}}
# 底部按钮图标
buttons_color={{colors.on_surface.default.hex}}
# 顶部按钮图标
top_buttons_color={{colors.on_surface.default.hex}}
# 按下状态的按钮
held_element_color={{colors.primary.default.hex}}
# 时间码文字
timecode_color={{colors.on_surface_variant.default.hex}}
# 拖动预览的时间气泡
time_pos_color={{colors.inverse_surface.default.hex}}
time_pos_outline_color={{colors.inverse_primary.default.hex}}
# 文件名标题
title_color={{colors.on_surface.default.hex}}

# 底板不透明度（0.0–1.0）。0.5 保留一点视频透出感，太高会盖住画面。
boxalpha=0.5
# 鼠标静止多少毫秒后隐藏 OSC。0 = 永不自动隐藏。
hidetimeout=3000
# 淡入淡出时长（毫秒），0 关闭动画
fadeduration=200
