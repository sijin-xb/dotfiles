# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$cmd_duration $directory$git_branch$git_status$python$nodejs$rust
  $character"""

[fill]
symbol = '-'
style = 'fg:{{colors.outline.default.hex}}'

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[ ](bold fg:{{colors.primary.default.hex}})"
error_symbol = "[ ](bold fg:{{colors.error.default.hex}})"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:{{colors.primary.default.hex}}"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:{{colors.primary.default.hex}})[$symbol $branch(:$remote_branch)](fg:{{colors.on_primary.default.hex}} bg:{{colors.primary.default.hex}})[ ](bold fg:{{colors.primary.default.hex}})"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold fg:{{colors.error.default.hex}})"

# 不带端符：format 里的字符是写死的，加了端符会在干净仓库留一个空胶囊。
# 状态值自带尾随空格，靠它和前面的 branch 胶囊拉开间距。
[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "fg:{{colors.on_primary.default.hex}} bg:{{colors.primary.default.hex}}"
conflicted = "🏳 "
ahead = "🏎💨 "
behind = "😰 "
diverged = "😵 "
untracked = "🤷 ‍"
stashed = "📦 "
modified = "📝 "
staged = '[++\($count\)](fg:{{colors.on_primary.default.hex}}) '
renamed = "✍️ "
deleted = "🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:{{colors.primary.default.hex}} bold fg:{{colors.on_primary.default.hex}})[](bold fg:{{colors.primary.default.hex}})"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold fg:{{colors.primary.default.hex}}"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
style_root = "red bold"
format = "[](bold fg:{{colors.primary.default.hex}})[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:{{colors.primary.default.hex}})[󰉋 → $path]($style)[](bold fg:{{colors.primary.default.hex}})'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:{{colors.primary.default.hex}})[󰪢 $duration](bold bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}})[](bold fg:{{colors.primary.default.hex}})'

# starship 默认用 emoji（🐍🦀），和 Nerd Font 风格不搭，换成 glyph
[python]
symbol = "󰌠 "
style = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
format = '[](bold fg:{{colors.primary.default.hex}})[$symbol$version]($style)[](bold fg:{{colors.primary.default.hex}})'

[nodejs]
symbol = "󰎙 "
style = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
format = '[](bold fg:{{colors.primary.default.hex}})[$symbol$version]($style)[](bold fg:{{colors.primary.default.hex}})'

[rust]
symbol = "󱘗 "
style = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
format = '[](bold fg:{{colors.primary.default.hex}})[$symbol$version]($style)[](bold fg:{{colors.primary.default.hex}})'
