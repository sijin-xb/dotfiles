context.modules = [
    {   name = libpipewire-module-filter-chain
        # ⚠ flags 必须有：这个 filter-chain 依赖 librnnoise_ladspa
        #   （noise-suppression-for-voice 包提供）。没有 flags 时模块是
        #   mandatory —— 包没装（或被 -Rns 清掉）pipewire 就直接起不来
        #   （2026-09-30 实测：整栈 failed，桌面「无输出/输入设备」）。
        #   加 ifexists nofail 后缺库只降级为「没有降噪源」，音频照常。
        flags = [ ifexists nofail ]
        args = {
            node.description = "Noise Canceling source"
            media.name       = "Noise Canceling source"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = librnnoise_ladspa
                        label  = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 10.0
                            "VAD Grace Period (ms)" = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            capture.props = {
                node.name      = "capture.rnnoise_source"
                node.passive   = true
                audio.rate     = 48000
            }
            playback.props = {
                node.name      = "rnnoise_source"
                media.class    = Audio/Source
                audio.rate     = 48000
            }
        }
    }
]
