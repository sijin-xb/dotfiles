# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$cmd_duration $directory$git_branch$git_status$python$nodejs$rust
  $character"""

[fill]
symbol = '-'
style = 'fg:#ae9b9e'

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[ ](bold fg:#ffb1c4)"
error_symbol = "[ ](bold fg:#ffb4ab)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:#ffb1c4"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#ffb1c4)[$symbol $branch(:$remote_branch)](fg:#410c20 bg:#ffb1c4)[ ](bold fg:#ffb1c4)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold fg:#ffb4ab)"

# 整个胶囊包在条件组里：条件组自身为空时连端符一起不渲染，
# 干净仓库不会留空胶囊。状态值自带尾随空格，靠它拉开与 branch 的间距。
[git_status]
format = '([](bold fg:#ffb1c4)[$all_status$ahead_behind]($style)[](bold fg:#ffb1c4))'
style = "fg:#410c20 bg:#ffb1c4"
conflicted = "🏳 "
ahead = "🏎💨 "
behind = "😰 "
diverged = "😵 "
untracked = "🤷 ‍"
stashed = "📦 "
modified = "📝 "
staged = '[++\($count\)](fg:#410c20) '
renamed = "✍️ "
deleted = "🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:#ffb1c4 bold fg:#410c20)[](bold fg:#ffb1c4)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold fg:#ffb1c4"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#ffb1c4 fg:#410c20"
style_root = "red bold"
format = "[](bold fg:#ffb1c4)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#ffb1c4 fg:#410c20"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#ffb1c4)[󰉋 → $path]($style)[](bold fg:#ffb1c4)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#ffb1c4)[󰪢 $duration](bold bg:#ffb1c4 fg:#410c20)[](bold fg:#ffb1c4)'

# starship 默认用 emoji（🐍🦀），和 Nerd Font 风格不搭，换成 glyph
[python]
symbol = "󰌠 "
style = "bg:#ffb1c4 fg:#410c20"
format = '[](bold fg:#ffb1c4)[$symbol$version]($style)[](bold fg:#ffb1c4)'

[nodejs]
symbol = "󰎙 "
style = "bg:#ffb1c4 fg:#410c20"
format = '[](bold fg:#ffb1c4)[$symbol$version]($style)[](bold fg:#ffb1c4)'

[rust]
symbol = "󱘗 "
style = "bg:#ffb1c4 fg:#410c20"
format = '[](bold fg:#ffb1c4)[$symbol$version]($style)[](bold fg:#ffb1c4)'
