# 基础路径
music_directory     "~/Music"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
log_file            "~/.config/mpd/log"
pid_file            "~/.config/mpd/pid"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"

# 以当前用户身份运行（不用 systemd 的 mpd 系统服务时需要这行）
#user "your_username"

# 音量控制方式
mixer_type "software"

# 正常音频输出（Arch 上一般用 pulse 或 pipewire-pulse）
audio_output {
    type    "pulse"
    name    "My Pulse Output"
}

# 可视化用的 fifo 输出，跟上面的正常输出并列，不要删掉上面那段
audio_output {
    type    "fifo"
    name    "my_fifo"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}

# 音乐库自动更新（可选，插U盘或改文件后自动重新扫描）
auto_update "yes"
